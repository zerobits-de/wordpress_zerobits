name: CI

on:
  push:
    branches: [main]
  pull_request:

# PHP version is the project standard - keep in sync with docker/wordpress/Dockerfile.
env:
  PHP_VERSION: "8.3"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PHP, coding standards, Twig, content, structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        working-directory: theme
        run: composer validate --strict --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('theme/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: theme
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Content and translations (en/de structure, images, legal pages)
        run: php bin/check-content.php theme

      - name: PHP syntax
        working-directory: theme
        run: composer run lint:php

      - name: PHP coding standards (WordPress)
        working-directory: theme
        run: composer run lint:phpcs

      - name: PHPStan
        working-directory: theme
        run: composer run analyse

      - name: Twig syntax
        run: php bin/twig-lint.php theme

      - name: Theme structure
        run: sh bin/validate-theme.sh theme

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config -q

      - name: Build and start
        run: docker compose up -d --build

      - name: Install theme dependencies
        run: docker compose exec -T -w /var/www/html/wp-content/themes/zb-theme wordpress composer install --no-interaction --no-progress --no-dev

      - name: Wait for WordPress
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8093/ || true)
            if [ "$code" != "000" ]; then echo "HTTP $code"; exit 0; fi
            sleep 2
          done
          echo "WordPress did not start"; exit 1

      # seed/ is not in the repository: the site is tested without blog articles.
      - name: Install WordPress
        run: docker compose exec -T wordpress bash /opt/zb/bin/wp-install.sh

      - name: Smoke test pages
        run: |
          set -e
          B=http://localhost:8093
          # Shell pattern matching instead of pipes into grep (avoids "Broken pipe").
          check() {
            local url="$1" expect="$2" needle="$3" body code html
            body=$(curl -s -w '\n%{http_code}' "$url")
            code="${body##*$'\n'}"
            html="${body%$'\n'*}"
            if [ "$code" != "$expect" ]; then
              echo "FAIL $url -> HTTP $code (expected $expect)"
              printf '%s\n' "$html" | sed -n '1,50p'
              exit 1
            fi
            if [[ "$html" != *"$needle"* ]]; then
              echo "FAIL $url missing '$needle'"; exit 1
            fi
            shopt -s nocasematch
            if [[ "$html" == *"fatal error"* || "$html" == *"Warning:"* ]]; then
              shopt -u nocasematch; echo "FAIL $url contains PHP errors"; exit 1
            fi
            shopt -u nocasematch
            echo "ok  $url ($code)"
          }
          redirect() {
            local got
            got=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$B$1")
            [ "$got" = "301 $B$2" ] || { echo "FAIL redirect $1: $got"; exit 1; }
            echo "ok  $1 -> $2"
          }
          # Both languages (slugs from theme/content/*.json).
          check $B/                 200 'lang="en-US"'
          check $B/                 200 'class="hero'
          check $B/                 200 'id="portfolio"'
          check $B/                 200 'hreflang="de"'
          check $B/de/              200 'lang="de-DE"'
          check $B/de/              200 'Schluss mit Routinearbeit.'
          check $B/                 200 'href="http://localhost:8093/services/automation/"'
          check $B/                 200 'href="http://localhost:8093/portfolio/foo-kaz/"'
          check $B/services/automation/ 200 'class="section service-rows'
          check $B/services/automation/ 200 'hreflang="de" href="http://localhost:8093/de/services/automatisierung/"'
          check $B/de/services/automatisierung/ 200 'id="tools"'
          check $B/services/cloud/    200 'id="odoo"'
          check $B/de/services/cloud/ 200 'id="odoo"'
          check $B/portfolio/foo-kaz/ 200 'class="project project--page'
          check $B/de/portfolio/linguu/ 200 'hreflang="en" href="http://localhost:8093/portfolio/linguu/"'
          check $B/blog/            200 'class="section blog-list'
          check $B/de/blog/         200 'lang="de-DE"'
          check $B/impress/         200 'class="section page-text'
          check $B/privacy-policy/  200 'class="section page-text'
          check $B/de/impressum/    200 'class="section page-text'
          check $B/de/datenschutz/  200 'class="section page-text'
          check $B/no-such-page-xyz/ 404 'class="not-found'
          # The homepage follows the browser's language; the language switch (cookie) wins.
          negotiate() {
            local got
            got=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "${@:2}" "$B/")
            [ "$got" = "$1" ] || { echo "FAIL language negotiation (${*:2}): $got"; exit 1; }
            echo "ok  / (${*:2}) -> $1"
          }
          negotiate "302 $B/de/" -H 'Accept-Language: de-DE,de;q=0.9,en;q=0.8'
          negotiate "200 "       -H 'Accept-Language: en-GB,en;q=0.9,de;q=0.8'
          negotiate "200 "       -H 'Accept-Language: fr-FR,fr;q=0.9'
          negotiate "200 "       -H 'Accept-Language: de-DE,de;q=0.9' -b 'zb_lang=en'
          negotiate "302 $B/de/" -H 'Accept-Language: en-US,en;q=0.9' -b 'zb_lang=de'
          negotiate "200 "       -H 'Accept-Language: de-DE,de;q=0.9' -e "$B/de/"
          negotiate "302 $B/de/" -H 'Accept-Language: de-DE,de;q=0.9' -e 'https://www.example.com/'
          got=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept-Language: de' $B/blog/)
          [ "$got" = "200" ] || { echo "FAIL /blog/ must not negotiate: $got"; exit 1; }
          echo "ok  only the homepage negotiates"
          # The former overview pages are sections now.
          redirect /services/ '/#services'
          redirect /de/services/ '/de/#services'
          redirect /portfolio/ '/#portfolio'
          redirect /odoo-partner/ '/services/cloud/#odoo'
          redirect /de/odoo-partner/ '/de/services/cloud/#odoo'
          redirect /category/uncategorized/ /blog/
          # Addresses of the former Elementor/TranslatePress site.
          redirect /impressum/ /de/impressum/
          redirect /de/impress/ /de/impressum/
          redirect /de/privacy-policy/ /de/datenschutz/
          redirect /ueber-uns/ '/#about-us'
          redirect /de/projects/foo-kaz/ '/de/#portfolio'

      - name: Debug log on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100 wordpress
          docker compose exec -T wordpress sh -c 'cat /var/www/html/wp-content/debug.log 2>/dev/null | tail -100 || true'

      - name: Tear down
        if: always()
        run: docker compose down -v

  build:
    name: Production package
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Build zb-theme.zip
        run: bash bin/build.sh

      - name: Inspect package
        run: |
          unzip -l build/zb-theme.zip | head -40
          unzip -l build/zb-theme.zip | grep -q 'zb-theme/style.css'
          unzip -l build/zb-theme.zip | grep -q 'zb-theme/vendor/autoload.php'
          unzip -l build/zb-theme.zip | grep -q 'zb-theme/content/de.json'
          unzip -l build/zb-theme.zip | grep -q 'zb-theme/content/en.json'
          ! unzip -l build/zb-theme.zip | grep -q 'phpstan'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zb-theme
          path: build/zb-theme.zip
          retention-days: 14
